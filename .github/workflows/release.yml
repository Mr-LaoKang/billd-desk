name: Release  on:   push:     tags:       - "v*"   workflow_dispatch:  permissions:   contents: write  jobs:   build-win:     runs-on: windows-latest     steps:       - uses: actions/checkout@v4       - uses: pnpm/action-setup@v4         with:           version: 9       - uses: actions/setup-node@v4         with:           node-version: 18           cache: pnpm       - run: pnpm install --no-frozen-lockfile       - run: pnpm exec vite build       - run: pnpm exec electron-builder --win         env:           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}       - uses: actions/upload-artifact@v4         with:           name: win-installer           path: electron-release/*/*.exe    build-macos:     runs-on: macos-latest     steps:       - uses: actions/checkout@v4       - uses: pnpm/action-setup@v4         with:           version: 9       - uses: actions/setup-node@v4         with:           node-version: 18           cache: pnpm       - run: pnpm install --no-frozen-lockfile       - run: pnpm exec vite build       - run: pnpm exec electron-builder --mac         env:           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}       - uses: actions/upload-artifact@v4         with:           name: mac-dmg           path: electron-release/*/*.dmg    build-linux:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - uses: pnpm/action-setup@v4         with:           version: 9       - uses: actions/setup-node@v4         with:           node-version: 18           cache: pnpm       - run: pnpm install --no-frozen-lockfile       - run: pnpm exec vite build       - run: pnpm exec electron-builder --linux         env:           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}       - uses: actions/upload-artifact@v4         with:           name: linux-appimage           path: electron-release/*/*.AppImage    publish:     needs: [build-win, build-macos, build-linux]     runs-on: ubuntu-latest     if: startsWith(github.ref, 'refs/tags/')     steps:       - uses: actions/download-artifact@v4       - uses: softprops/action-gh-release@v2         with:           files: "**/*"